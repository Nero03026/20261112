<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜拳</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100vw;
            height: 100vh;
            background-color: #eddaca;
            color: azure;
        }

        .arena {
            /* background-color: #554201; */
            width: 80%;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 100px;
            font-size: 100px;
            text-align: center;
        }

        .self {
            width: 30%;
            height: 90%;
            background-color: #024B57;
            margin-right: 50px;
            border-radius: 15px;
            box-shadow: 4px 4px rgb(245, 245, 242);
        }

        .other {
            width: 30%;
            height: 90%;
            background-color: #C05A04;
            border-radius: 15px;
            box-shadow: 4px 4px rgb(245, 245, 242);
        }

        .btn-all {
            width: 60%;
            height: 30%;
            background-color: #457373;
            border-radius: 15px;
            box-shadow: 4px 4px rgb(255, 253, 253);
            display: flex;
            align-content: center;
            /* justify-content: center; */
            flex-wrap: wrap;
            justify-content: space-around;
            font-size: 50px;
            text-align: center;
            line-height: 100px;

        }

        .btn {
            background-color: azure;
            width: 100px;
            height: 100px;

            border-radius: 50%;
            box-shadow: 4px 4px rgb(189, 187, 187);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .paper {
            background-image: url(./img/paper.png);
        }

        .stone {
            background-image: url(./img/rock.png);
        }

        .scissor {
            background-image: url(./img/scissors.png);
        }

        .start {
            background-color: #8A0502;
            width: 40%;
            height: 100px;
            border-radius: 15px;
            box-shadow: 4px 4px rgba(224, 221, 221);
            border: none;
            cursor: pointer;
            font-size: 60px;
            color: #eddaca;
            line-height: 60px;
        }
    </style>
</head>

<body>
    <div class="arena">
        <div class="self">我方
            <div class="self-show"></div>
        </div>
        <div class="other">電腦
            <div class="other-show"></div>
        </div>
    </div>
    <div class="btn-all">
        <div class="btn paper"></div>
        <div class="btn scissor"></div>
        <div class="btn stone"></div>
        <button class="start">開始</button>
    </div>
</body>

</html>
